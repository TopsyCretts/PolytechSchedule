name: test_build.yml
on:
  push:
    branches:
      - "main"
      - "staging"
      - "dev"
  pull_request:
    branches:
      - "main"
      - "staging"
      - "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: |
          echo "Npm install";
          npm install;
          echo "Build";
          npm run build;
          echo "Build complete!";
