  <head>
    <meta charset="UTF-8" />
    <link

    />
    <meta

      content="width=device-width, initial-scale=1.0"
    />
    <title>Политех</title>
    <meta
      name="description"
      lang="ru_Ru"
      content="Узнавай расписание пар и радуйся жизни"
    />
    <link
      rel="apple-touch-icon"
      href="/images/apple-touch-icon.png"
    />
    <link

      href="/images/favicon.ico"
      sizes="48x48"
    />
    <link

      sizes="any"

    />
    <link

      href="/images/pwa-maskable-192x192.png"
    />
    <meta
      name="theme-color"

    />
    <meta
      name="theme-color"
      content="#0a0f2c"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="stylesheet"
      href="/src/app/styles/main.scss"
    />
  </head>
  <body>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Restores the path saved by public/404.html before the router mounts.
      ;(function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script
      type="module"
      src="/src/app/entrypoint"
    ></script>
  </body>
</html>
